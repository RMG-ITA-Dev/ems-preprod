<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EMS 2.0 - Engagement Management System</title>
    <meta name="description" content="Sistema de gestión de encargos para firmas de auditoría y consultoría. Clientes, encargos, órdenes de trabajo, hojas de tiempo y gastos." />
    <!-- `author` es la organización que publica el sitio, no el nombre del producto. -->
    <meta name="author" content="Ruizmier Group" />
    <meta name="keywords" content="gestión de encargos, auditoría, hojas de tiempo, consultoría, órdenes de trabajo, control de gastos" />

    <!-- og:* y twitter:* repiten el <title> a propósito: si divergen, el nombre que
         ve quien comparte el enlace deja de ser el de la pestaña. -->
    <meta property="og:title" content="EMS 2.0 - Engagement Management System" />
    <meta property="og:description" content="Sistema de gestión de encargos para firmas de auditoría y consultoría" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ruizmier Group" />
    <meta property="og:locale" content="es" />
    <!-- Absoluta porque og:image no resuelve rutas relativas en la mayoría de los scrapers.

         PENDIENTE AL PASAR A PREPROD: este host es el de Lovable, y `docs/operations.md` ya
         fija Railway como destino del frontend ("Target model (decided 2026-09-11): frontend
         on Railway, backend on Supabase, no Lovable"). Mientras esto siga en desarrollo el
         host viejo sirve; cuando haya dominio de Railway hay que tocar tres lugares:
         `og:image`, `twitter:image` y la línea "Published URL" de README.md, que es de donde
         salió este valor y que todavía contradice a operations.md. -->
    <meta property="og:image" content="https://aurora-engage-pro.lovable.app/logo.png" />
    <meta property="og:image:alt" content="EMS 2.0" />

    <!-- `summary`, no `summary_large_image`: logo.png es casi cuadrado (1444x1089) y
         en la tarjeta ancha saldría recortado por arriba y por abajo. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="EMS 2.0 - Engagement Management System" />
    <meta name="twitter:description" content="Sistema de gestión de encargos para firmas de auditoría y consultoría" />
    <meta name="twitter:image" content="https://aurora-engage-pro.lovable.app/logo.png" />
    <meta name="twitter:image:alt" content="EMS 2.0" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Preconnect to critical origins to reduce network chain latency -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://ugqxfnrxvksiltwxzist.supabase.co" crossorigin>
    <link rel="preconnect" href="https://cdn.gpteng.co" crossorigin>
    <!-- Load IBM Plex Sans non-blocking with media swap pattern -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@300;400;500;600;700&display=swap"></noscript>
    <script>
      (function() {
        var t = localStorage.getItem('theme');
        var d = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (d) document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = d ? 'dark' : 'light';
      })();
    </script>
    <meta name="theme-color" content="#008795" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0c1a2b" media="(prefers-color-scheme: dark)">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
