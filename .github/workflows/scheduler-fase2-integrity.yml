name: Scheduler Integrity — Fase 2

# 🔴 No renombrar el archivo a `scheduler-integrity.yml`: ese path ya lo usa un workflow
# distinto de la Fase 4 (UI/Gantt) en `sruizmier-scheduler-v3` y sus derivadas
# (app-integrity, rls-migration-tests con --self-test, hermetic-rebuild, browser-contract).
# GitHub identifica un workflow por su ruta de archivo, no por rama — dos workflows en el
# mismo path, en ramas distintas, chocan al converger. Ver bugs/scheduler/fase_2/plan_v2.md
# para el hallazgo completo (2026-07-30).
#
# Reescrito para la migración cero (bugs/migracion_cero/plan_v2.md §2.5.a). Two independent
# jobs:
#
#   rls-migration-tests — fast, self-contained (postgres:17 service container, no Docker
#     Compose beyond the container itself). Runs supabase/tests/local/run-rls-tests.sh:
#     aplica el set consolidado (cero_01..cero_06 + el catálogo RBAC real) una sola vez
#     sobre una base scratch y corre las 8 suites de aserciones existentes (RLS, ambas RPCs,
#     schema-convergence, trigger). Reemplaza las 4 lanes históricas (rollout/drift/
#     failure-path/shim de servicio) que probaban la mecánica de un historial de migraciones
#     puntuales que ya no existe — ver docs/migraciones/legado-consolidacion.md §4ter.
#
#   consolidated-replay — el criterio de aceptación central de la migración cero: el set
#     consolidado, aplicado solo (sin preseed ni parche alguno) sobre una base vacía, debe
#     converger al fingerprint aceptado de baseline_184 módulo los hunks documentados en
#     docs/migraciones/DIFF-INTENCIONAL-consolidacion.md. Reemplaza route-parity (Rutas A/C
#     del Scheduler Fase 2, ya cerrado — la muerte del preseed es criterio de éxito del
#     informe de consolidación §2.1). Necesita el Supabase CLI real + Docker. Desde Fase 4
#     (plan §4.3), también aplica los 7 seeds _cero_1x_ (no tocan DDL, el gate de fingerprint
#     no cambia) y corre verify-seed.sql + verify-auth-bootstrap.sh como pasos finales.
#
#     ETL fase 1 (bugs/ETL/carga/fase1/plan_v2.md): el replay termina en modo PREINIT (verify-seed.sql
#     con etl_f1_mode=preinit). El administrador genérico y el calendario los crea la consola
#     scripts/etl/fase1.mjs, que se ensaya con credenciales ficticias (integración: inicialización,
#     recuperación, login y repetición), y todo el ciclo se repite en una SEGUNDA instalación local desde
#     limpio comprobando mismos hashes de migraciones, estado nuevo y generación nueva de journal.

on:
  push:
    branches: ['*']
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'scripts/etl/**'
      - '.github/workflows/scheduler-fase2-integrity.yml'
  pull_request:
    branches: ['main', 'development']
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'scripts/etl/**'
      - '.github/workflows/scheduler-fase2-integrity.yml'
  workflow_dispatch: {}

jobs:
  rls-migration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        # postgres:16 rechazaba GRANT ... MAINTAIN ... (privilegio nuevo en Postgres 17,
        # que sí aparece en cero_06_grants.sql — dumpeado desde el stack real 17.6) con
        # "unrecognized privilege type" — hallazgo real del primer run de CI (2026-08-24).
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Runner db-name validator self-test (hostile names rejected)
        run: bash supabase/tests/local/run-rls-tests.sh --self-test

      - name: Run the RLS/RPC/schema-convergence/trigger assertion suites (consolidated set)
        run: bash supabase/tests/local/run-rls-tests.sh

  consolidated-replay:
    runs-on: ubuntu-latest
    # packages: read para el login a ghcr.io de abajo (las imágenes de Supabase son públicas; el
    # login solo cambia el pull de anónimo a autenticado, que tiene otro límite).
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # La consola ETL fase 1 y su integración usan el SDK de supabase-js del lockfile: instalación
      # reproducible con el mismo Node/npm del resto del CI (test.yml).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Use pinned npm
        run: npm install --global npm@11.21.1

      - name: Install dependencies (reproducible)
        run: npm ci

      # Versión pineada (nunca `version: latest`): los fixtures de fingerprint son
      # sensibles a la versión exacta del CLI (formato de pg_dump, imagen de Postgres,
      # esquema de GoTrue). Ver supabase/tests/fixtures/route-fingerprints/VERSIONS.md —
      # subir esta versión es un cambio deliberado que implica re-capturar y re-aceptar los
      # fixtures, nunca un drift silencioso.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.100.1

      # 🟢 Bug preexistente encontrado en vivo (2026-08-06, dev-scheduler-fase_7): el runner de
      # Ubuntu trae `pg_dump` 16.x por defecto, pero el stack local de Supabase corre Postgres
      # 17.6 — pg_dump se niega a volcar un servidor con una versión mayor que la suya
      # ("aborting because of server version mismatch"). Se instala el cliente 17 del
      # repositorio oficial de PGDG y se lo prioriza en el PATH para el resto del job.
      - name: Install postgresql-client-17 (pg_dump must match the local Supabase server, 17.6)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      # A diferencia del route-parity histórico, el set consolidado no necesita el truco de
      # esconder supabase/migrations/: no hay ninguna migración fail-fast que espere un parche
      # ad-hoc (la muerte del preseed es criterio de éxito, informe §2.1). Si `start` no las
      # aplica solo, es un regresión real, no un caso esperado.
      # Pre-descarga secuencial con reintentos por imagen (y respaldo en public.ecr.aws): reintentar solo
      # `supabase start` repite las 13 descargas en paralelo y no converge cuando ghcr.io limita (2026-10-27:
      # 4 intentos seguidos fallaron). El login es opcional: si falla, las descargas siguen anónimas.
      - name: Pre-descargar las imágenes de Supabase (una a una, con reintentos)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || echo "::notice::docker login a ghcr.io falló; se descarga sin autenticar"
          bash supabase/tests/local/ci-pull-supabase-images.sh

      # `supabase start` baja ~13 imágenes en paralelo de ghcr.io y el registro responde
      # `toomanyrequests` de forma intermitente (visto el 2026-10-22 y el 2026-10-27, en ramas
      # distintas y sin cambios de código de por medio). Se reintenta SOLO ese error, con espera
      # creciente; las capas ya bajadas quedan en caché y cada intento avanza. Cualquier otro
      # fallo (migración que no aplica, healthcheck) sigue siendo fatal al primer intento.
      - name: supabase start (aplica el set consolidado limpio, sin preseed)
        run: |
          set -o pipefail
          for attempt in 1 2 3 4; do
            if supabase start 2>&1 | tee "$RUNNER_TEMP/supabase-start.log"; then
              exit 0
            fi
            if ! grep -q "toomanyrequests" "$RUNNER_TEMP/supabase-start.log"; then
              exit 1
            fi
            echo "::warning::ghcr.io limitó las descargas (intento $attempt/4); se reintenta"
            supabase stop --no-backup || true
            sleep $((attempt * 30))
          done
          exit 1

      - name: Verificar convergencia (7 migraciones aplicadas, 0 pendientes)
        run: |
          supabase migration list --local
          supabase db push --dry-run --include-all --local

      - name: Capturar fingerprint del replay
        run: bash supabase/tests/local/capture-route-fingerprint.sh replay

      # Sube el fingerprint del replay como artifact SIEMPRE (incluso si el gate de abajo
      # falla) — hallazgo real (2026-08-24): un diff de plataforma (imagen de auth) entre
      # el runner de CI y un Docker local no se puede reproducir localmente de forma
      # confiable para re-capturar `consolidado_renamed_*`. Con este artifact, re-aceptar
      # un fixture nuevo es bajar este zip, no perseguir el mismatch a ciegas.
      - name: Subir fingerprint del replay como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-fingerprint-replay
          path: supabase/tests/fixtures/route-fingerprints/replay_*
          retention-days: 14

      # 🟢 Bug preexistente encontrado en vivo (2026-08-06, dev-scheduler-fase_7): pg_dump
      # envuelve cada dump en un token \restrict/\unrestrict aleatorio que difiere en cada
      # invocación incluso contra un esquema sin cambios. Filtrar por contenido, no posición.
      #
      # 🟢 Segundo filtro (hallazgo real, primer run de CI contra este workflow, 2026-08-24):
      # las particiones diarias de realtime.messages_YYYY_MM_DD rotan por calendario —
      # documentado en docs/migraciones/DIFF-INTENCIONAL-consolidacion.md §2 como ruido
      # esperado, pero el filtro nunca se agregó a este script (solo se aplicaba a mano en
      # verificaciones manuales). Sin él, el gate falla apenas pasa un día entre la captura
      # del fixture aceptado y el run del CI.
      - name: Gate — replay converge al fingerprint aceptado (baseline_184 vía consolidado_renamed_*)
        run: |
          FP=supabase/tests/fixtures/route-fingerprints
          fail=0
          RESTRICT='^\\(un)?restrict '
          PARTITION_NOISE='messages_[0-9]{4}_[0-9]{2}_[0-9]{2}'

          for name in schema catalog_policies catalog_grants catalog_column_grants catalog_routine_grants catalog_storage_buckets; do
            ext="txt"
            [[ "$name" == "schema" ]] && ext="sql"
            a="$FP/consolidado_renamed_${name}.${ext}"
            b="$FP/replay_${name}.${ext}"
            if ! diff <(grep -vE "$RESTRICT" "$a" | grep -vE "$PARTITION_NOISE") \
                      <(grep -vE "$RESTRICT" "$b" | grep -vE "$PARTITION_NOISE"); then
              echo "::error::replay diverge de consolidado_renamed_${name}.${ext} (ver diff arriba)."
              fail=1
            fi
          done

          [[ "$fail" -eq 0 ]] || exit 1
          echo "Gate de replay consolidado (renombrado, Fase 3): OK (schema, policies, grants, column_grants, routine_grants, storage_buckets)."

      # ETL fase 1 (bugs/ETL/carga/fase1/plan_v2.md §3, §9): el replay termina en modo PREINIT (catálogos y
      # configuración definitivos; cero clientes, staff, cuentas, roles y feriados). El administrador
      # genérico y el calendario NO los siembra una migración: los crea la consola específica
      # `scripts/etl/fase1.mjs`, que acá se ensaya con credenciales ficticias y de un solo uso.
      - name: Verificar datos del seed (verify-seed.sql, modo preinit)
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 \
            -v etl_f1_mode=preinit -f supabase/tests/local/verify-seed.sql

      - name: Preparar el entorno de la consola ETL fase 1 (stack local, credenciales de ensayo)
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          ADMIN_PW="Ens-$(openssl rand -hex 12)-Aa1"
          echo "::add-mask::${SERVICE_ROLE_KEY}"
          echo "::add-mask::${ANON_KEY}"
          echo "::add-mask::${ADMIN_PW}"
          {
            echo "PGHOST=127.0.0.1"
            echo "PGPORT=54322"
            echo "PGUSER=postgres"
            echo "PGPASSWORD=postgres"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "ADMIN_TEMP_PASSWORD=${ADMIN_PW}"
            echo "ETL_F1_SIGNUP_CLOSED=1"
            echo "ETL_F1_STATE_DIR=${RUNNER_TEMP}/etl-f1-state-a"
            echo "MAIL_ENABLED=false"
          } >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/etl-f1-state-a"

      - name: Consola ETL fase 1 — preflight (guarda de conexión y estado preinit)
        run: node scripts/etl/fase1.mjs preflight --config scripts/etl/fase1.config.example.json

      # Inicialización ficticia + recuperación (interrupciones tras ficha, Auth y calendario) + login +
      # repetición sin escrituras de negocio + ejecutor duplicado. Es la prueba T05/T06; NO debe correr
      # después de una inicialización manual que invalide sus precondiciones.
      - name: Consola ETL fase 1 — inicialización ficticia, recuperación, login y repetición
        env:
          ETL_F1_INTEGRATION: '1'
        run: npx vitest run scripts/etl/__tests__/fase1.integration.test.ts

      - name: Consola ETL fase 1 — verify (estado persistido y login)
        run: node scripts/etl/fase1.mjs verify --config scripts/etl/fase1.config.example.json

      - name: Verificar datos del seed (verify-seed.sql, modo initialized)
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 \
            -v etl_f1_mode=initialized -v etl_f1_admin_email=admin@ruizmier.com \
            -f supabase/tests/local/verify-seed.sql

      # El login real contra la cuenta creada por la consola (GoTrue autentica, get_my_staff_id() resuelve
      # con el access_token real, exactamente 1 admin en user_roles). No cambia contraseñas.
      - name: Verificar login real del administrador (verify-auth-bootstrap.sh)
        run: bash supabase/tests/local/verify-auth-bootstrap.sh

      - name: Sin residuos operativos ni cambios históricos atribuibles al inicializador
        run: |
          set -euo pipefail
          for t in clients engagements work_orders timesheet_periods; do
            n="$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -t -A -c "SELECT count(*) FROM public.${t}")"
            [[ "$n" == "0" ]] || { echo "::error::public.${t} tiene ${n} filas tras la inicialización (se esperaban 0)"; exit 1; }
          done
          echo "OK: cero clientes, encargos, OT y períodos de hoja de tiempo"

      # --- Segunda instalación local, desde limpio (F1-CA21) -----------------------------------------
      # Mismos archivos de migración (mismos hashes), estado nuevo, generación nueva de journal/mapas, y
      # un journal de la instalación anterior debe rechazarse. `supabase stop --no-backup` destruye los
      # volúmenes locales: es el mismo stack efímero del job, nunca un ambiente real.
      - name: Segunda instalación — registrar hashes, journal, inventario de Auth y catálogos de la primera
        run: |
          set -euo pipefail
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          sha256sum supabase/migrations/*.sql > "${RUNNER_TEMP}/migrations-sha-1.txt"
          cp "${ETL_F1_STATE_DIR}"/fase1-*.journal.json "${RUNNER_TEMP}/journal-1.json"
          psql "$DB" -t -A -c "SELECT id FROM auth.users ORDER BY id" > "${RUNNER_TEMP}/auth-1.txt"
          # Huella de catálogos/configuración por CLAVES NATURALES (los UUID generados difieren por instalación).
          cat > "${RUNNER_TEMP}/catalog-fingerprint.sql" <<'SQL'
          SELECT md5(concat_ws('#',
            (SELECT string_agg(industry_name || '|' || fiscal_year_end, ';' ORDER BY industry_name) FROM public.industries),
            (SELECT string_agg(expense_name || '|' || default_unit_cost::text || '|' || is_active::text, ';' ORDER BY expense_name) FROM public.expense_types),
            (SELECT string_agg(p.abbreviation || '|' || c.category_name || '|' || c.rate_high_bob::text || '|' || c.rate_low_bob::text || '|'
                               || c.rate_high_usd::text || '|' || c.rate_low_usd::text || '|' || COALESCE(c.default_app_role::text, ''),
                               ';' ORDER BY p.abbreviation, c.category_name)
               FROM public.categories c JOIN public.practicas p ON p.practica_id = c.practica_id),
            (SELECT string_agg(code || '|' || name, ';' ORDER BY code) FROM public.servicios),
            (SELECT string_agg(name, ';' ORDER BY name) FROM public.society),
            (SELECT string_agg(setting_key || '=' || setting_value, ';' ORDER BY setting_key)
               FROM public.global_settings WHERE setting_key <> 'ADM_ACTIVITY_ID')));
          SQL
          psql "$DB" -t -A -f "${RUNNER_TEMP}/catalog-fingerprint.sql" > "${RUNNER_TEMP}/catalog-1.txt"
          test -s "${RUNNER_TEMP}/auth-1.txt" && test -s "${RUNNER_TEMP}/catalog-1.txt"

      - name: Segunda instalación — reconstruir el stack desde limpio
        run: |
          set -o pipefail
          supabase stop --no-backup
          for attempt in 1 2 3 4; do
            if supabase start 2>&1 | tee "$RUNNER_TEMP/supabase-start-2.log"; then
              exit 0
            fi
            if ! grep -q "toomanyrequests" "$RUNNER_TEMP/supabase-start-2.log"; then
              exit 1
            fi
            echo "::warning::ghcr.io limitó las descargas (intento $attempt/4); se reintenta"
            supabase stop --no-backup || true
            sleep $((attempt * 30))
          done
          exit 1

      - name: Segunda instalación — mismos hashes, estado nuevo y mismos catálogos
        run: |
          set -euo pipefail
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          sha256sum supabase/migrations/*.sql | diff - "${RUNNER_TEMP}/migrations-sha-1.txt"
          psql "$DB" -v ON_ERROR_STOP=1 -v etl_f1_mode=preinit -f supabase/tests/local/verify-seed.sql
          n="$(psql "$DB" -t -A -c "SELECT count(*) FROM auth.users")"
          [[ "$n" == "0" ]] || { echo "::error::la segunda instalación no empezó limpia (auth.users=${n})"; exit 1; }
          psql "$DB" -t -A -f "${RUNNER_TEMP}/catalog-fingerprint.sql" | diff - "${RUNNER_TEMP}/catalog-1.txt"

      - name: Segunda instalación — entorno propio (generación nueva de journal y mapas)
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          ADMIN_PW="Ens-$(openssl rand -hex 12)-Aa1"
          echo "::add-mask::${SERVICE_ROLE_KEY}"
          echo "::add-mask::${ANON_KEY}"
          echo "::add-mask::${ADMIN_PW}"
          {
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "ADMIN_TEMP_PASSWORD=${ADMIN_PW}"
            echo "ETL_F1_STATE_DIR=${RUNNER_TEMP}/etl-f1-state-b"
            echo "ETL_F1_INSTALLATION_ID=f1-ensayo-local-0002"
          } >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/etl-f1-state-b"
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('scripts/etl/fase1.config.example.json','utf8'));c.installationId='f1-ensayo-local-0002';fs.writeFileSync(process.env.RUNNER_TEMP+'/fase1.config.2.json',JSON.stringify(c))"

      - name: Segunda instalación — un journal de otra generación se rechaza (BLOQUEADO)
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/journal-1.json" "${ETL_F1_STATE_DIR}/fase1-f1-ensayo-local-0002.journal.json"
          set +e
          node scripts/etl/fase1.mjs initialize --config "${RUNNER_TEMP}/fase1.config.2.json"
          code=$?
          set -e
          [[ "$code" -eq 2 ]] || { echo "::error::se esperaba salida 2 (BLOQUEADO) al reanudar con un journal de otra generación, fue ${code}"; exit 1; }
          rm -f "${ETL_F1_STATE_DIR}/fase1-f1-ensayo-local-0002.journal.json"

      - name: Segunda instalación — consola, inicialización ficticia, recuperación, login y repetición
        env:
          ETL_F1_INTEGRATION: '1'
        run: npx vitest run scripts/etl/__tests__/fase1.integration.test.ts

      - name: Segunda instalación — generaciones distintas, Auth distinto y verificación final
        run: |
          set -euo pipefail
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          node -e "
            const fs=require('fs');
            const a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/journal-1.json','utf8'));
            const dir=process.env.ETL_F1_STATE_DIR;
            const f=fs.readdirSync(dir).find(n=>n.endsWith('.journal.json'));
            const b=JSON.parse(fs.readFileSync(dir+'/'+f,'utf8'));
            for (const k of ['installationId','staffId','correlation','authUserId']) {
              if (a[k]===b[k]) { console.error('la generación nueva repite '+k); process.exit(1); }
            }
            if (a.migrations.inventoryHash!==b.migrations.inventoryHash) { console.error('inventario de migraciones distinto'); process.exit(1); }
            console.log('OK: journals de generaciones distintas con el mismo inventario de migraciones');
          "
          psql "$DB" -t -A -c "SELECT id FROM auth.users ORDER BY id" > "${RUNNER_TEMP}/auth-2.txt"
          if grep -qxFf "${RUNNER_TEMP}/auth-1.txt" "${RUNNER_TEMP}/auth-2.txt"; then
            echo "::error::la segunda instalación reutiliza una cuenta de Auth de la primera"; exit 1
          fi
          node scripts/etl/fase1.mjs verify --config "${RUNNER_TEMP}/fase1.config.2.json"
          psql "$DB" -v ON_ERROR_STOP=1 -v etl_f1_mode=initialized -v etl_f1_admin_email=admin@ruizmier.com \
            -f supabase/tests/local/verify-seed.sql
          bash supabase/tests/local/verify-auth-bootstrap.sh
