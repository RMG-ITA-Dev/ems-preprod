name: Scheduler Integrity — Fase 2

# 🔴 No renombrar el archivo a `scheduler-integrity.yml`: ese path ya lo usa un workflow
# distinto de la Fase 4 (UI/Gantt) en `sruizmier-scheduler-v3` y sus derivadas
# (app-integrity, rls-migration-tests con --self-test, hermetic-rebuild, browser-contract).
# GitHub identifica un workflow por su ruta de archivo, no por rama — dos workflows en el
# mismo path, en ramas distintas, chocan al converger. Ver bugs/scheduler/fase_2/plan_v2.md
# para el hallazgo completo (2026-07-30).
#
# Reescrito para la migración cero (bugs/migracion_cero/plan_v2.md §2.5.a). Two independent
# jobs:
#
#   rls-migration-tests — fast, self-contained (postgres:17 service container, no Docker
#     Compose beyond the container itself). Runs supabase/tests/local/run-rls-tests.sh:
#     aplica el set consolidado (cero_01..cero_06 + el catálogo RBAC real) una sola vez
#     sobre una base scratch y corre las 8 suites de aserciones existentes (RLS, ambas RPCs,
#     schema-convergence, trigger). Reemplaza las 4 lanes históricas (rollout/drift/
#     failure-path/shim de servicio) que probaban la mecánica de un historial de migraciones
#     puntuales que ya no existe — ver docs/migraciones/legado-consolidacion.md §4ter.
#
#   consolidated-replay — el criterio de aceptación central de la migración cero: el set
#     consolidado, aplicado solo (sin preseed ni parche alguno) sobre una base vacía, debe
#     converger al fingerprint aceptado de baseline_184 módulo los hunks documentados en
#     docs/migraciones/DIFF-INTENCIONAL-consolidacion.md. Reemplaza route-parity (Rutas A/C
#     del Scheduler Fase 2, ya cerrado — la muerte del preseed es criterio de éxito del
#     informe de consolidación §2.1). Necesita el Supabase CLI real + Docker. Desde Fase 4
#     (plan §4.3), también aplica los 7 seeds _cero_1x_ (no tocan DDL, el gate de fingerprint
#     no cambia) y corre verify-seed.sql + verify-auth-bootstrap.sh como pasos finales.

on:
  push:
    branches: ['*']
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - '.github/workflows/scheduler-fase2-integrity.yml'
  pull_request:
    branches: ['main', 'development']
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - '.github/workflows/scheduler-fase2-integrity.yml'
  workflow_dispatch: {}

jobs:
  rls-migration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        # postgres:16 rechazaba GRANT ... MAINTAIN ... (privilegio nuevo en Postgres 17,
        # que sí aparece en cero_06_grants.sql — dumpeado desde el stack real 17.6) con
        # "unrecognized privilege type" — hallazgo real del primer run de CI (2026-08-24).
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Runner db-name validator self-test (hostile names rejected)
        run: bash supabase/tests/local/run-rls-tests.sh --self-test

      - name: Run the RLS/RPC/schema-convergence/trigger assertion suites (consolidated set)
        run: bash supabase/tests/local/run-rls-tests.sh

  consolidated-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versión pineada (nunca `version: latest`): los fixtures de fingerprint son
      # sensibles a la versión exacta del CLI (formato de pg_dump, imagen de Postgres,
      # esquema de GoTrue). Ver supabase/tests/fixtures/route-fingerprints/VERSIONS.md —
      # subir esta versión es un cambio deliberado que implica re-capturar y re-aceptar los
      # fixtures, nunca un drift silencioso.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.100.1

      # 🟢 Bug preexistente encontrado en vivo (2026-08-06, dev-scheduler-fase_7): el runner de
      # Ubuntu trae `pg_dump` 16.x por defecto, pero el stack local de Supabase corre Postgres
      # 17.6 — pg_dump se niega a volcar un servidor con una versión mayor que la suya
      # ("aborting because of server version mismatch"). Se instala el cliente 17 del
      # repositorio oficial de PGDG y se lo prioriza en el PATH para el resto del job.
      - name: Install postgresql-client-17 (pg_dump must match the local Supabase server, 17.6)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      # A diferencia del route-parity histórico, el set consolidado no necesita el truco de
      # esconder supabase/migrations/: no hay ninguna migración fail-fast que espere un parche
      # ad-hoc (la muerte del preseed es criterio de éxito, informe §2.1). Si `start` no las
      # aplica solo, es un regresión real, no un caso esperado.
      - name: supabase start (aplica el set consolidado limpio, sin preseed)
        run: supabase start

      - name: Verificar convergencia (7 migraciones aplicadas, 0 pendientes)
        run: |
          supabase migration list --local
          supabase db push --dry-run --include-all --local

      - name: Capturar fingerprint del replay
        run: bash supabase/tests/local/capture-route-fingerprint.sh replay

      # Sube el fingerprint del replay como artifact SIEMPRE (incluso si el gate de abajo
      # falla) — hallazgo real (2026-08-24): un diff de plataforma (imagen de auth) entre
      # el runner de CI y un Docker local no se puede reproducir localmente de forma
      # confiable para re-capturar `consolidado_renamed_*`. Con este artifact, re-aceptar
      # un fixture nuevo es bajar este zip, no perseguir el mismatch a ciegas.
      - name: Subir fingerprint del replay como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-fingerprint-replay
          path: supabase/tests/fixtures/route-fingerprints/replay_*
          retention-days: 14

      # 🟢 Bug preexistente encontrado en vivo (2026-08-06, dev-scheduler-fase_7): pg_dump
      # envuelve cada dump en un token \restrict/\unrestrict aleatorio que difiere en cada
      # invocación incluso contra un esquema sin cambios. Filtrar por contenido, no posición.
      #
      # 🟢 Segundo filtro (hallazgo real, primer run de CI contra este workflow, 2026-08-24):
      # las particiones diarias de realtime.messages_YYYY_MM_DD rotan por calendario —
      # documentado en docs/migraciones/DIFF-INTENCIONAL-consolidacion.md §2 como ruido
      # esperado, pero el filtro nunca se agregó a este script (solo se aplicaba a mano en
      # verificaciones manuales). Sin él, el gate falla apenas pasa un día entre la captura
      # del fixture aceptado y el run del CI.
      - name: Gate — replay converge al fingerprint aceptado (baseline_184 vía consolidado_renamed_*)
        run: |
          FP=supabase/tests/fixtures/route-fingerprints
          fail=0
          RESTRICT='^\\(un)?restrict '
          PARTITION_NOISE='messages_[0-9]{4}_[0-9]{2}_[0-9]{2}'

          for name in schema catalog_policies catalog_grants catalog_column_grants catalog_routine_grants catalog_storage_buckets; do
            ext="txt"
            [[ "$name" == "schema" ]] && ext="sql"
            a="$FP/consolidado_renamed_${name}.${ext}"
            b="$FP/replay_${name}.${ext}"
            if ! diff <(grep -vE "$RESTRICT" "$a" | grep -vE "$PARTITION_NOISE") \
                      <(grep -vE "$RESTRICT" "$b" | grep -vE "$PARTITION_NOISE"); then
              echo "::error::replay diverge de consolidado_renamed_${name}.${ext} (ver diff arriba)."
              fail=1
            fi
          done

          [[ "$fail" -eq 0 ]] || exit 1
          echo "Gate de replay consolidado (renombrado, Fase 3): OK (schema, policies, grants, column_grants, routine_grants, storage_buckets)."

      # Fase 4 (plan §4.3): los 7 archivos _cero_1x_seed_* no tocan DDL — el gate de arriba ya
      # prueba que el fingerprint no cambió. Esto verifica los DATOS: conteos, ADM/is_system,
      # ADM_ACTIVITY_ID, default_app_role 61/61, cero datos demo, feriados vs generador.
      - name: Verificar datos del seed de Fase 4 (verify-seed.sql)
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 \
            -f supabase/tests/local/verify-seed.sql

      # Fase 4 (plan §4.3.4ter): el bootstrap admin escribe directo en auth.*, esquema
      # gestionado por GoTrue — el replay + verify-seed.sql solo prueban que las filas existen
      # con las columnas declaradas, no que GoTrue pueda autenticar contra ellas. Este es el
      # gate real: Admin API set-password -> login por password -> get_my_staff_id() con el
      # access_token real -> exactamente 1 fila admin en user_roles.
      - name: Verificar bootstrap de Auth end-to-end (verify-auth-bootstrap.sh)
        run: bash supabase/tests/local/verify-auth-bootstrap.sh
